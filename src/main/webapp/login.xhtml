<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/templates/template.xhtml"
                xmlns:h="jakarta.faces.html">

    <ui:define name="title">
        Login Page
    </ui:define>

    <ui:define name="content">
        <div class="container mt-5">
            <h1 class="text-center">Login</h1>
            <p class="text-center text-muted">Enter your credentials to access your account.</p>

            <h:form>
                <!-- Username Input -->
                <div class="mb-3">
                    <h:outputLabel for="userName" value="Username:" class="form-label" />
                    <h:inputText id="userName"
                                 value="#{loginController.user.username}"
                                 styleClass="form-control #{facesContext.validationFailed and empty loginController.user.username ? 'is-invalid' : ''}"
                                 required="true" requiredMessage="Username is required." />
                    <h:message for="userName" styleClass="invalid-feedback" />
                </div>

                <!-- Password Input -->
                <div class="mb-3">
                    <h:outputLabel for="password" value="Password:" class="form-label" />
                    <h:inputSecret id="password"
                                   value="#{loginController.user.password}"
                                   styleClass="form-control #{facesContext.validationFailed and empty loginController.user.password ? 'is-invalid' : ''}"
                                   required="true" requiredMessage="Password is required." />
                    <h:message for="password" styleClass="invalid-feedback" />
                </div>

                <!-- Login Button -->
                <div class="d-grid">
                    <h:commandButton value="Login" action="#{loginController.doLogin}"
                                     styleClass="btn btn-primary btn-lg" />
                </div>

                <!-- Link to Sign-Up Page -->
                <div class="mt-3 text-center">
                    <p class="text-muted">Don't have an account?</p>
                    <h:link outcome="/sign_up.xhtml" styleClass="btn btn-link">Sign Up Here</h:link>
                </div>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
