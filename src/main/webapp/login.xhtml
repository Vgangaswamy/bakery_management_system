<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Login Page</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" />

    <!-- Custom CSS -->
    <h:outputStylesheet library="css" name="style.css" />
</h:head>

<h:body>
    <div class="container mt-5">
        <h1 class="text-center">Login</h1>
        <p class="text-center text-muted">Enter your credentials to access your account.</p>

        <h:form>
            <!-- Username Input -->
            <div class="mb-3">
                <h:outputLabel for="userName" value="Username:" class="form-label" />
                <h:inputText id="userName"
                             value="#{loginController.user.username}"
                             styleClass="form-control #{facesContext.validationFailed and empty loginController.user.username ? 'is-invalid' : ''}"
                             required="true" requiredMessage="Username is required." />
                <h:message for="userName" styleClass="invalid-feedback" />
            </div>

            <!-- Password Input -->
            <div class="mb-3">
                <h:outputLabel for="password" value="Password:" class="form-label" />
                <h:inputSecret id="password"
                               value="#{loginController.user.password}"
                               styleClass="form-control #{facesContext.validationFailed and empty loginController.user.password ? 'is-invalid' : ''}"
                               required="true" requiredMessage="Password is required." />
                <h:message for="password" styleClass="invalid-feedback" />
            </div>

            <!-- Login Button -->
            <div class="d-grid">
                <h:commandButton value="Login" action="#{loginController.doLogin}"
                                 styleClass="btn btn-pastel-blue" />
            </div>

            <!-- Link to Sign-Up Page -->
            <div class="mt-3 text-center">
                <p class="text-muted">Don't have an account?</p>
                <h:link outcome="/sign_up.xhtml" styleClass="btn btn-pastel-pink">Sign Up Here</h:link>
            </div>
        </h:form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"
            integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS" crossorigin="anonymous"></script>
</h:body>

</html>
