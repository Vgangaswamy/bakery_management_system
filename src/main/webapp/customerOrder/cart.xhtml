<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="../WEB-INF/templates/authNtemplate.xhtml">

    <ui:define name="title">Cart</ui:define>

    <ui:define name="content">
        <h:outputStylesheet library="css" name="style.css" />

        <h2>Your Cart</h2>

        <!-- Display Items in Cart -->
        <h:dataTable styleClass="table table-striped table-hover"
                     value="#{customerController.customerOrderItems}" var="item">
            <h:column>
                <f:facet name="header">Name</f:facet>
                <h:outputText value="#{item.name}" />
            </h:column>
            <h:column>
                <f:facet name="header">Description</f:facet>
                <h:outputText value="#{item.productDescription}" />
            </h:column>
            <h:column>
                <f:facet name="header">Price</f:facet>
                <h:outputText value="#{item.price}" />
            </h:column>
            <h:column>
                <f:facet name="header">Actions</f:facet>
                <h:form>
                    <h:commandButton value="Edit"
                                     action="#{customerController.editProduct(item)}"
                                     styleClass="btn btn-pastel-peach"  />
                    <h:commandButton value="Delete"
                                     action="#{customerController.deleteProduct(item)}"
                                     styleClass="btn btn-pastel-peach" />
                </h:form>
            </h:column>
        </h:dataTable>

        <!-- Total Price -->
        <h3>Total Price: #{customerController.customerOrder.totalPrice}</h3>

        <!-- Customer Details Section -->
        <h2>Enter Your Details</h2>
        <h:form>
            <h:outputLabel for="name" value="Name:" />
            <h:inputText id="name" value="#{customerController.customer.name}" required="true"
                         requiredMessage="Name is required." />
            <h:message for="name" styleClass="text-danger" />

            <br />

            <h:outputLabel for="email" value="Email:" />
            <h:inputText id="email" value="#{customerController.customer.email}" required="true"
                         requiredMessage="Email is required." />
            <h:message for="email" styleClass="text-danger" />

            <br />

            <h:outputLabel for="phoneNumber" value="Phone Number:" />
            <h:inputText id="phoneNumber" value="#{customerController.customer.phoneNumber}" required="true"
                         requiredMessage="Phone number is required." />
            <h:message for="phoneNumber" styleClass="text-danger" />

            <br />

            <!-- Confirm Order Button -->
            <h:commandButton value="Confirm Order" action="#{customerController.saveCustomerOrder}"
                             styleClass="btn btn-pastel-peach" />
        </h:form>

        <!-- Go Back to Products -->
        <h:form>
            <h:commandButton value="Back to Home" action="#{customerController.goToWelcomePage}" styleClass="btn btn-pastel-peach" />
        </h:form>
    </ui:define>
</ui:composition>
