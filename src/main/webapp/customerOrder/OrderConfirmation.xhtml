<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="../WEB-INF/templates/authNtemplate.xhtml">

   <ui:define name="title">Order Confirmation</ui:define>

   <ui:define name="content">
      <h2>Order Confirmed</h2>
      <p>Thank you, #{customerController.customer.name}! Your order has been confirmed.</p>
      <p>Total Price: #{customerController.customerOrder.totalPrice}</p>
      <h:form>
         <h:commandButton value="Back to Home" action="#{customerController.goToWelcomePage}" styleClass="btn btn-pastel-peach " />
      </h:form>
   </ui:define>
</ui:composition>
