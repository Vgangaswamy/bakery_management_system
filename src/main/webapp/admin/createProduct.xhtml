<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                template="../WEB-INF/templates/authNtemplate.xhtml">

    <ui:define name="title">Create Product</ui:define>

    <ui:define name="content">
        <h1>Create a New Bakery Product</h1>
        <h:form>
            <h:outputLabel for="bakeryProductName" value="Product Name:" />
            <h:inputText id="bakeryProductName" value="#{bakeryController.bakery.name}" required="true" />
            <br />

            <h:outputLabel for="productQuantity" value="Quantity:" />
            <h:inputText id="productQuantity" value="#{bakeryController.bakery.quantity}" required="true" />
            <br />

            <h:outputLabel for="productType" value="Product Type:" />
            <h:selectOneMenu id="productType" value="#{bakeryController.bakery.type}">
                <f:selectItems value="#{bakeryService.allProductTypes}" var="type" itemValue="#{type}" itemLabel="#{type}" />
            </h:selectOneMenu>
            <br />

            <h:outputLabel for="productDescription" value="Description:" />
            <h:inputText id="productDescription" value="#{bakeryController.bakery.productDescription}" required="true" />
            <br />

            <h:outputLabel for="isAvailable" value="Available:" />
            <h:selectBooleanCheckbox id="isAvailable" value="#{bakeryController.bakery.available}" />
            <br />

            <h:outputLabel for="productPrice" value="Price:" />
            <h:inputText id="productPrice" value="#{bakeryController.bakery.price}" required="true" />
            <br />

            <h:commandButton value="Submit Product" action="#{bakeryController.saveBakeryProduct}" />
        </h:form>
    </ui:define>
</ui:composition>
